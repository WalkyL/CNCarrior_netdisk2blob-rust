name: release-macos

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.1"
        required: true
      publish_release:
        description: "Create or update the GitHub release with macOS assets"
        required: false
        default: "true"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_id: macos-x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            package_name: ccbg-macos-x86_64
            artifact_name: ccbg-macos-x86_64.tar.gz
          - package_id: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            package_name: ccbg-macos-arm64
            artifact_name: ccbg-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Ensure GNU checksum tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sha256sum >/dev/null 2>&1; then
            brew install coreutils
          fi

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.rust_target }}" -p gatewayd
          scripts/build-native-package.sh \
            --skip-build \
            --target "${{ matrix.rust_target }}" \
            --package-name "${{ matrix.package_name }}"
          mkdir -p release-asset
          cp "target/native-packages/${{ matrix.artifact_name }}"* release-asset/
          test -s "release-asset/${{ matrix.artifact_name }}"
          test -s "release-asset/${{ matrix.artifact_name }}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-${{ matrix.package_id }}
          path: release-asset/*
          if-no-files-found: error

  release-macos:
    needs: build-macos-packages
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ccbg-macos-*
          path: release
          merge-multiple: true

      - name: Generate macOS checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'ccbg-macos-checksums.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > ccbg-macos-checksums.txt

      - name: Upload macOS release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-macos-release-bundle
          path: release
          if-no-files-found: error

      - name: Create or update GitHub release
        if: inputs.publish_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: release/*
