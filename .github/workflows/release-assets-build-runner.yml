name: release assets via build-runner

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        default: v0.1.10
      build_linux_lxc:
        description: Build Linux LXC package in the local Podman build-runner
        required: true
        default: true
        type: boolean
      build_macos_x86_64:
        description: Build macOS x86_64 community asset
        required: true
        default: true
        type: boolean
      build_macos_arm64:
        description: Build macOS arm64 community asset
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CCBG_BUILD_IMAGE: localhost/product-build-runner:latest
  CCBG_CARGO_ZIGBUILD_VERSION: 0.22.3
  CCBG_ZIG_VERSION: 0.16.0
  CCBG_LINUX_TARGET: x86_64-unknown-linux-gnu
  http_proxy: http://127.0.0.1:10808
  https_proxy: http://127.0.0.1:10808
  HTTP_PROXY: http://127.0.0.1:10808
  HTTPS_PROXY: http://127.0.0.1:10808

jobs:
  linux_lxc:
    name: ccbg-lxc-package
    if: ${{ inputs.build_linux_lxc }}
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Ensure Podman machine is running
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $machines = podman machine list --format json | ConvertFrom-Json
          $running = $machines | Where-Object { $_.Default -and $_.Running }
          if (-not $running) {
            podman machine start | Out-Null
          }

      - name: Verify build runner image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          podman image inspect $env:CCBG_BUILD_IMAGE | Out-Null

      - name: Build Linux LXC package in build runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path

          podman run --rm `
            --pull=never `
            -e http_proxy=$env:http_proxy `
            -e https_proxy=$env:https_proxy `
            -e HTTP_PROXY=$env:HTTP_PROXY `
            -e HTTPS_PROXY=$env:HTTPS_PROXY `
            -v "${workspace}:/workspace" `
            -w /workspace `
            $env:CCBG_BUILD_IMAGE `
            bash -lc "cargo build --release --locked --target '${env:CCBG_LINUX_TARGET}' -p gatewayd && scripts/build-lxc-package.sh --skip-build --target '${env:CCBG_LINUX_TARGET}' && sha256sum -c target/lxc-package/ccbg-lxc-package.tar.gz.sha256"

      - name: Upload Linux LXC package
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-lxc-package
          path: |
            target/lxc-package/ccbg-lxc-package.tar.gz
            target/lxc-package/ccbg-lxc-package.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build_macos_x86_64:
    name: ccbg-macos-x86_64
    if: ${{ inputs.build_macos_x86_64 }}
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Ensure Podman machine is running
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $machines = podman machine list --format json | ConvertFrom-Json
          $running = $machines | Where-Object { $_.Default -and $_.Running }
          if (-not $running) {
            podman machine start | Out-Null
          }

      - name: Verify build runner image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          podman image inspect $env:CCBG_BUILD_IMAGE | Out-Null

      - name: Build gatewayd and package macOS asset in build runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $scriptPath = Join-Path $workspace "target\ci-build\build-ccbg-macos-x86_64.sh"

          $script = @'
          set -euo pipefail

          cargo install cargo-zigbuild --locked --version "${CCBG_CARGO_ZIGBUILD_VERSION}"

          zig_url="https://ziglang.org/download/${CCBG_ZIG_VERSION}/zig-x86_64-linux-${CCBG_ZIG_VERSION}.tar.xz"
          zig_root="/tmp/zig"
          mkdir -p "${zig_root}"
          curl -fsSL "${zig_url}" -o /tmp/zig.tar.xz
          tar -C "${zig_root}" -xJf /tmp/zig.tar.xz --strip-components=1
          export PATH="${zig_root}:$PATH"
          "${zig_root}/zig" version

          rustup target add "__TARGET__"
          cargo zigbuild --release --locked --target "__TARGET__" -p gatewayd
          scripts/build-native-package.sh \
            --skip-build \
            --target "__TARGET__" \
            --package-name "__PACKAGE__"
          sha256sum -c "target/native-packages/__PACKAGE__.tar.gz.sha256"
          '@

          $script = $script.Replace('__TARGET__', 'x86_64-apple-darwin').Replace('__PACKAGE__', 'ccbg-macos-x86_64')
          [System.IO.Directory]::CreateDirectory((Split-Path -Parent $scriptPath)) | Out-Null
          [System.IO.File]::WriteAllText($scriptPath, ($script -replace "`r`n", "`n"), [System.Text.Encoding]::ASCII)

          podman run --rm `
            --pull=never `
            -e CCBG_CARGO_ZIGBUILD_VERSION=$env:CCBG_CARGO_ZIGBUILD_VERSION `
            -e CCBG_ZIG_VERSION=$env:CCBG_ZIG_VERSION `
            -e http_proxy=$env:http_proxy `
            -e https_proxy=$env:https_proxy `
            -e HTTP_PROXY=$env:HTTP_PROXY `
            -e HTTPS_PROXY=$env:HTTPS_PROXY `
            -v "${workspace}:/workspace" `
            -w /workspace `
            $env:CCBG_BUILD_IMAGE `
            bash "/workspace/target/ci-build/build-ccbg-macos-x86_64.sh"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-macos-x86_64
          path: |
            target/native-packages/ccbg-macos-x86_64.tar.gz
            target/native-packages/ccbg-macos-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build_macos_arm64:
    name: ccbg-macos-arm64
    if: ${{ inputs.build_macos_arm64 }}
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Ensure Podman machine is running
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $machines = podman machine list --format json | ConvertFrom-Json
          $running = $machines | Where-Object { $_.Default -and $_.Running }
          if (-not $running) {
            podman machine start | Out-Null
          }

      - name: Verify build runner image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          podman image inspect $env:CCBG_BUILD_IMAGE | Out-Null

      - name: Build gatewayd and package macOS asset in build runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $scriptPath = Join-Path $workspace "target\ci-build\build-ccbg-macos-arm64.sh"

          $script = @'
          set -euo pipefail

          cargo install cargo-zigbuild --locked --version "${CCBG_CARGO_ZIGBUILD_VERSION}"

          zig_url="https://ziglang.org/download/${CCBG_ZIG_VERSION}/zig-x86_64-linux-${CCBG_ZIG_VERSION}.tar.xz"
          zig_root="/tmp/zig"
          mkdir -p "${zig_root}"
          curl -fsSL "${zig_url}" -o /tmp/zig.tar.xz
          tar -C "${zig_root}" -xJf /tmp/zig.tar.xz --strip-components=1
          export PATH="${zig_root}:$PATH"
          "${zig_root}/zig" version

          rustup target add "__TARGET__"
          cargo zigbuild --release --locked --target "__TARGET__" -p gatewayd
          scripts/build-native-package.sh \
            --skip-build \
            --target "__TARGET__" \
            --package-name "__PACKAGE__"
          sha256sum -c "target/native-packages/__PACKAGE__.tar.gz.sha256"
          '@

          $script = $script.Replace('__TARGET__', 'aarch64-apple-darwin').Replace('__PACKAGE__', 'ccbg-macos-arm64')
          [System.IO.Directory]::CreateDirectory((Split-Path -Parent $scriptPath)) | Out-Null
          [System.IO.File]::WriteAllText($scriptPath, ($script -replace "`r`n", "`n"), [System.Text.Encoding]::ASCII)

          podman run --rm `
            --pull=never `
            -e CCBG_CARGO_ZIGBUILD_VERSION=$env:CCBG_CARGO_ZIGBUILD_VERSION `
            -e CCBG_ZIG_VERSION=$env:CCBG_ZIG_VERSION `
            -e http_proxy=$env:http_proxy `
            -e https_proxy=$env:https_proxy `
            -e HTTP_PROXY=$env:HTTP_PROXY `
            -e HTTPS_PROXY=$env:HTTPS_PROXY `
            -v "${workspace}:/workspace" `
            -w /workspace `
            $env:CCBG_BUILD_IMAGE `
            bash "/workspace/target/ci-build/build-ccbg-macos-arm64.sh"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-macos-arm64
          path: |
            target/native-packages/ccbg-macos-arm64.tar.gz
            target/native-packages/ccbg-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  summary:
    name: build-runner-summary
    needs:
      - linux_lxc
      - build_macos_x86_64
      - build_macos_arm64
    if: ${{ always() }}
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Summarize artifact-only boundary
        shell: powershell
        run: |
          @"
          release assets via build-runner completed.

          Boundary:
          - This workflow only produces GitHub Actions artifacts.
          - It does not create or publish a GitHub Release.
          - It does not deploy Cloudflare assets.
          - Download artifacts back to the local release host and merge them with:
            scripts/download-build-runner-release-assets.sh --run-id <github-run-id>
            scripts/release-local.sh <tag>
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
