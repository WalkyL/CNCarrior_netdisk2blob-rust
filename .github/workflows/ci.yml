name: ci

on:
  push:
    branches:
      - main
      - test
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: License and NOTICE check
        run: python3 scripts/license-check.py

      - name: Run tests
        run: cargo test --workspace

      - name: Catalog lint
        run: python3 scripts/catalog-lint.py

      - name: Release provenance smoke
        run: |
          python3 scripts/generate-release-provenance.py \
            --release-name ci-smoke \
            --tag "${GITHUB_REF_NAME:-ci}" \
            --artifact Cargo.toml \
            --artifact PROVENANCE.md \
            --build-step "cargo test --workspace" \
            --build-step "python3 scripts/license-check.py" \
            --out-dir target/release-provenance-smoke

      - name: Cloudflare public fingerprint check
        run: python3 scripts/check-cloudflare-public-fingerprint.py

      - name: Native package structure smoke
        run: |
          mkdir -p target/release
          printf '#!/bin/sh\nexit 0\n' > target/release/gatewayd
          chmod +x target/release/gatewayd
          scripts/build-native-package.sh --skip-build --target x86_64-unknown-linux-gnu

      - name: OneDrive parking checks
        run: |
          python3 scripts/check-onedrive-parking.py
          python3 scripts/check-onedrive-restore-checklist.py

      - name: Backup restore drill smoke
        run: python3 scripts/check-backup-restore-drill.py --drill-root target/backup-restore-drill-ci --write-sample

      - name: S3 smoke (stub, offline)
        run: python3 scripts/s3-smoke.py

  container-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: docker
            file: deploy/Dockerfile
            tag: ccbg-gatewayd:ci-docker
          - runtime: podman
            file: deploy/Containerfile
            tag: ccbg-gatewayd:ci-podman
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Container smoke (${{ matrix.runtime }})
        run: python3 scripts/container-smoke.py --runtime "${{ matrix.runtime }}" --file "${{ matrix.file }}" --tag "${{ matrix.tag }}"
