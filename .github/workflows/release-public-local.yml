name: release-public-local

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.1"
        required: true
      publish_release:
        description: "Create or update the GitHub release"
        required: false
        default: "true"
      push_container:
        description: "Build and push the GHCR multi-arch container image"
        required: false
        default: "true"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.14.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Release quality gate
        run: |
          set -euo pipefail
          cargo fmt --all --check
          python3 scripts/license-check.py
          cargo test --workspace
          python3 scripts/catalog-lint.py
          python3 scripts/check-cloudflare-public-fingerprint.py
          python3 scripts/check-onedrive-parking.py
          python3 scripts/check-onedrive-restore-checklist.py
          python3 scripts/check-backup-restore-drill.py --drill-root target/backup-restore-drill-release --write-sample
          python3 scripts/s3-smoke.py

  build-local-packages:
    needs: verify
    runs-on: [self-hosted, Linux, X64, local-linux-x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_id: lxc-x86_64
            kind: lxc
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: ccbg-lxc-package.tar.gz
          - package_id: windows-x86_64
            kind: native
            rust_target: x86_64-pc-windows-gnu
            package_name: ccbg-windows-x86_64
            artifact_name: ccbg-windows-x86_64.zip
          - package_id: openwrt-arm64
            kind: openwrt
            rust_target: aarch64-unknown-linux-musl
            artifact_name: ccbg-openwrt-lite.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Zig compiler shims
        shell: bash
        run: |
          set -euo pipefail
          ZIG_HOME="$HOME/.local/zig"
          ZIG_BIN="$ZIG_HOME/zig"
          download_zig() {
            rm -rf "$ZIG_HOME"
            mkdir -p "$ZIG_HOME"
            if command -v wget >/dev/null 2>&1; then
              wget -qO- "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
                | tar -xJ --strip-components=1 -C "$ZIG_HOME"
            else
              curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
                | tar -xJ --strip-components=1 -C "$ZIG_HOME"
            fi
          }
          if [ ! -x "$ZIG_BIN" ] || ! "$ZIG_BIN" version >/dev/null 2>&1; then
            download_zig
          fi
          "$ZIG_BIN" version
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/cc" <<'EOF'
          #!/usr/bin/env bash
          map_target() {
            case "$1" in
              x86_64-unknown-linux-gnu) echo "x86_64-linux-gnu" ;;
              x86_64-unknown-linux-musl) echo "x86_64-linux-musl" ;;
              aarch64-unknown-linux-gnu) echo "aarch64-linux-gnu" ;;
              aarch64-unknown-linux-musl) echo "aarch64-linux-musl" ;;
              x86_64-pc-windows-gnu) echo "x86_64-windows-gnu" ;;
              *) echo "$1" ;;
            esac
          }
          args=()
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --target=*) args+=("--target=$(map_target "${1#--target=}")") ;;
              -target) shift; args+=("-target" "$(map_target "$1")") ;;
              *) args+=("$1") ;;
            esac
            shift
          done
          exec "$HOME/.local/zig/zig" cc "${args[@]}"
          EOF
          cat > "$HOME/.local/bin/c++" <<'EOF'
          #!/usr/bin/env bash
          map_target() {
            case "$1" in
              x86_64-unknown-linux-gnu) echo "x86_64-linux-gnu" ;;
              x86_64-unknown-linux-musl) echo "x86_64-linux-musl" ;;
              aarch64-unknown-linux-gnu) echo "aarch64-linux-gnu" ;;
              aarch64-unknown-linux-musl) echo "aarch64-linux-musl" ;;
              x86_64-pc-windows-gnu) echo "x86_64-windows-gnu" ;;
              *) echo "$1" ;;
            esac
          }
          args=()
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --target=*) args+=("--target=$(map_target "${1#--target=}")") ;;
              -target) shift; args+=("-target" "$(map_target "$1")") ;;
              *) args+=("$1") ;;
            esac
            shift
          done
          exec "$HOME/.local/zig/zig" c++ "${args[@]}"
          EOF
          ln -sf "$HOME/.local/bin/cc" "$HOME/.local/bin/gcc"
          ln -sf "$HOME/.local/bin/c++" "$HOME/.local/bin/g++"
          ln -sf "$HOME/.local/bin/cc" "$HOME/.local/bin/clang"
          ln -sf "$HOME/.local/bin/c++" "$HOME/.local/bin/clang++"
          chmod +x "$HOME/.local/bin/cc" "$HOME/.local/bin/c++"
          echo "$ZIG_HOME" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CC=cc" >> "$GITHUB_ENV"
          echo "CXX=c++" >> "$GITHUB_ENV"

      - name: Bootstrap rustup
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          case "${{ matrix.kind }}" in
            lxc)
              cargo build --release --locked -p gatewayd
              scripts/build-lxc-package.sh --skip-build
              cp target/lxc-package/ccbg-lxc-package.tar.gz* release-asset/
              ;;
            native)
              cargo zigbuild --release --locked --target "${{ matrix.rust_target }}" -p gatewayd
              scripts/build-native-package.sh \
                --skip-build \
                --target "${{ matrix.rust_target }}" \
                --package-name "${{ matrix.package_name }}"
              cp "target/native-packages/${{ matrix.artifact_name }}"* release-asset/
              ;;
            openwrt)
              cargo zigbuild --release --locked --target "${{ matrix.rust_target }}" -p gatewayd -p mcp-server
              scripts/build-openwrt-lite-package.sh --skip-build --target "${{ matrix.rust_target }}"
              cp target/openwrt-lite/ccbg-openwrt-lite.tar.gz* release-asset/
              ;;
            *)
              echo "unsupported package kind: ${{ matrix.kind }}" >&2
              exit 2
              ;;
          esac
          test -s "release-asset/${{ matrix.artifact_name }}"
          test -s "release-asset/${{ matrix.artifact_name }}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-${{ matrix.package_id }}
          path: release-asset/*
          if-no-files-found: error

  build-macos-packages:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_id: macos-x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            package_name: ccbg-macos-x86_64
            artifact_name: ccbg-macos-x86_64.tar.gz
          - package_id: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            package_name: ccbg-macos-arm64
            artifact_name: ccbg-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Ensure GNU checksum tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sha256sum >/dev/null 2>&1; then
            brew install coreutils
          fi

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.rust_target }}" -p gatewayd
          scripts/build-native-package.sh \
            --skip-build \
            --target "${{ matrix.rust_target }}" \
            --package-name "${{ matrix.package_name }}"
          mkdir -p release-asset
          cp "target/native-packages/${{ matrix.artifact_name }}"* release-asset/
          test -s "release-asset/${{ matrix.artifact_name }}"
          test -s "release-asset/${{ matrix.artifact_name }}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-${{ matrix.package_id }}
          path: release-asset/*
          if-no-files-found: error

  build-container-image:
    needs: verify
    if: inputs.push_container != 'false'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lower}/carrier-cloud-blob-gateway"
          tag="${{ inputs.release_tag }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${tag}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Record image digest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "image=${{ steps.meta.outputs.image }}"
            echo "tag=${{ inputs.release_tag }}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "platforms=linux/amd64,linux/arm64"
          } > ccbg-container-image.txt

      - name: Upload container digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-container-image
          path: ccbg-container-image.txt
          if-no-files-found: error

  release:
    needs:
      - build-local-packages
      - build-macos-packages
      - build-container-image
    if: >
      ${{
        always() &&
        needs.build-local-packages.result == 'success' &&
        needs.build-macos-packages.result == 'success' &&
        (
          needs.build-container-image.result == 'success' ||
          needs.build-container-image.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ccbg-*
          path: release
          merge-multiple: true

      - name: Generate checksums and provenance
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'ccbg-checksums.txt' ! -name 'release-provenance.*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > ccbg-checksums.txt
          cd ..

          args=(
            python3 scripts/generate-release-provenance.py
            --release-name "CCBG ${{ inputs.release_tag }}"
            --tag "${{ inputs.release_tag }}"
            --out-dir release
            --build-step "release-public-local: verify"
            --build-step "release-public-local: local Linux packages"
            --build-step "release-public-local: macOS packages"
            --build-step "release-public-local: container image"
          )
          while IFS= read -r file; do
            args+=(--artifact "release/${file}")
          done < <(find release -maxdepth 1 -type f ! -name 'release-provenance.*' -printf '%f\n' | LC_ALL=C sort)
          "${args[@]}"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccbg-release-bundle
          path: release
          if-no-files-found: error

      - name: Create or update GitHub release
        if: inputs.publish_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: release/*

  mirror-public-release:
    needs: release
    if: inputs.publish_release != 'false'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.mirror.outputs.enabled }}
      repo: ${{ steps.mirror.outputs.repo }}
    steps:
      - name: Detect public mirror config
        id: mirror
        env:
          CCBG_PUBLIC_RELEASE_REPO: ${{ vars.CCBG_PUBLIC_RELEASE_REPO || vars.PUBLIC_RELEASE_REPO }}
          CCBG_PUBLIC_RELEASE_REPO_TOKEN: ${{ secrets.CCBG_PUBLIC_RELEASE_REPO_TOKEN || secrets.PUBLIC_RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CCBG_PUBLIC_RELEASE_REPO}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Public release mirror is not configured; skipping."
            exit 0
          fi
          if [ -z "${CCBG_PUBLIC_RELEASE_REPO_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CCBG_PUBLIC_RELEASE_REPO is set but token is missing; skipping mirror."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "repo=${CCBG_PUBLIC_RELEASE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Download release bundle artifact
        if: steps.mirror.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ccbg-release-bundle
          path: release

      - name: Create or update public mirror release
        if: steps.mirror.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.CCBG_PUBLIC_RELEASE_REPO_TOKEN || secrets.PUBLIC_RELEASE_REPO_TOKEN }}
          CCBG_PUBLIC_RELEASE_REPO: ${{ steps.mirror.outputs.repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Mirrored CCBG release assets from ${GITHUB_REPOSITORY}."
          if gh release view "${RELEASE_TAG}" --repo "${CCBG_PUBLIC_RELEASE_REPO}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${CCBG_PUBLIC_RELEASE_REPO}" --title "${RELEASE_TAG}" --notes "${notes}"
          else
            gh release create "${RELEASE_TAG}" --repo "${CCBG_PUBLIC_RELEASE_REPO}" --title "${RELEASE_TAG}" --notes "${notes}"
          fi
          gh release upload "${RELEASE_TAG}" release/* --repo "${CCBG_PUBLIC_RELEASE_REPO}" --clobber

  verify-release-downloads:
    needs:
      - release
      - mirror-public-release
    if: inputs.publish_release != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest release download URLs
        shell: bash
        run: |
          set -euo pipefail
          download_repo="${{ needs.mirror-public-release.outputs.repo }}"
          if [ -z "${download_repo}" ]; then
            download_repo="${GITHUB_REPOSITORY}"
          fi
          base="https://github.com/${download_repo}/releases/latest/download"
          assets=(
            ccbg-lxc-package.tar.gz
            ccbg-windows-x86_64.zip
            ccbg-macos-x86_64.tar.gz
            ccbg-macos-arm64.tar.gz
            ccbg-openwrt-lite.tar.gz
            ccbg-checksums.txt
            release-provenance.json
          )
          for asset in "${assets[@]}"; do
            echo "Verifying ${asset}"
            curl -fsSIL "${base}/${asset}" >/tmp/ccbg-release-asset.headers
            grep -Eiq '^HTTP/.* 200' /tmp/ccbg-release-asset.headers
          done
