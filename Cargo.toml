[workspace]
members = [
    "crates/blob-core",
    "crates/browser-cdp",
    "crates/gatewayd",
    "crates/metadata-store",
    "crates/policy-engine",
    "crates/provider-mobile",
    "crates/provider-onedrive",
    "crates/provider-telecom",
    "crates/provider-unicom",
    "crates/replication-engine",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
aes = "0.8"
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
cbc = "0.1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
md5 = { package = "md-5", version = "0.10" }
percent-encoding = "2.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
