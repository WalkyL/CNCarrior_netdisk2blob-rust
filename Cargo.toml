[workspace]
members = [
    "crates/admin-api",
    "crates/admin-tui",
    "crates/auth-broker",
    "crates/blob-core",
    "crates/browser-cdp",
    "crates/platform-profiles",
    "crates/gatewayd",
    "crates/mcp-server",
    "crates/metadata-store",
    "crates/object-crypto",
    "crates/policy-engine",
    "crates/provider-mobile",
    "crates/provider-onedrive",
    "crates/provider-telecom",
    "crates/provider-unicom",
    "crates/replication-engine",
]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "COMMERCIAL-LICENSE.md"
version = "0.1.6"

[workspace.dependencies]
aes-gcm = "0.10"
aes = "0.8"
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart"] }
base64 = "0.22"
bytes = "1.10"
cbc = "0.1"
chacha20poly1305 = "0.10"
chrono = "0.4"
ecb = "0.1"
futures-core = "0.3"
futures-util = "0.3"
flate2 = "1.1"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
md5 = { package = "md-5", version = "0.10" }
percent-encoding = "2.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
tempfile = "3"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
