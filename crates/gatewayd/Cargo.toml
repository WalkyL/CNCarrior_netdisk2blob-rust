[package]
name = "gatewayd"
version = "0.1.11"
edition = "2024"
license-file = "../../COMMERCIAL-LICENSE.md"

[features]
default = ["full-host"]
full-host = []
lite-host = []

[dependencies]
admin-api = { path = "../admin-api" }
auth-broker = { path = "../auth-broker" }
anyhow = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blob-core = { path = "../blob-core" }
browser-cdp = { path = "../browser-cdp" }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
libc = { workspace = true }
md5 = { workspace = true }
futures-util = { workspace = true }
metadata-store = { path = "../metadata-store" }
object-crypto = { path = "../object-crypto" }
percent-encoding = { workspace = true }
policy-engine = { path = "../policy-engine" }
provider-mobile = { path = "../provider-mobile" }
provider-onedrive = { path = "../provider-onedrive" }
provider-telecom = { path = "../provider-telecom" }
provider-unicom = { path = "../provider-unicom" }
rand = { workspace = true }
reqwest = { workspace = true }
replication-engine = { path = "../replication-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
